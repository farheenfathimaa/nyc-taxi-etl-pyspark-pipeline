# -------------------------------------------------------------------------------
# NYC Taxi ETL - local Airflow + PySpark stack (based on the official Airflow
# "docker-compose.yaml" setup, trimmed to LocalExecutor for a single laptop).
#
#   docker compose version  ->  should print Docker Compose v2+
#   docker compose build
#   docker compose up airflow-init    (one-off: migrate the DB + create admin user)
#   docker compose up -d              (webserver + scheduler + postgres + redis)
#
# Airflow UI:  http://localhost:8080   login: airflow / airflow
# -------------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .            # repo root so the Dockerfile can COPY requirements.txt
    dockerfile: airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-nyc-taxi-airflow:2.10.5}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: 'false'
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__DAG_CONCURRENCY: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__FERNET_KEY: '${FERNET_KEY:-LQ-qUZfBHBXzPP-KtPOz-QuUOgdZDtwp_pvlgr_HgLs=}'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '30'
    AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_WEB_SECRET:-docker-compose-secret-key-change-me}'
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_WEB_SERVER_PORT:-8080}
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # ---- pipeline configuration (read by dags + scripts) ----
    TAXI_DATASET: '${TAXI_DATASET:-yellow}'
    TAXI_MONTHS: '${TAXI_MONTHS:-2025-01}'
    DATA_ROOT: '/opt/airflow/data'
    # ---- spark knobs consumed by spark/jobs/taxi_etl.py ----
    SPARK_DRIVER_MEMORY: '${SPARK_DRIVER_MEMORY:-2g}'
    SPARK_MASTER_URL: '${SPARK_MASTER_URL:-local[*]}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./spark:/opt/airflow/spark
    - ./data:/opt/airflow/data
  user: '${AIRFLOW_UID:-50000}:0'
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow']
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      retries: 5
      timeout: 3s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >-
      -c "airflow db migrate && airflow users create --role Admin --username airflow --email airflow@example.com --firstname airflow --lastname airflow --password airflow || true"
    environment:
      <<: *airflow-common-env
    restart: 'no'

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '${AIRFLOW_WEB_SERVER_PORT:-8080}:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 15s
      retries: 10
      timeout: 10s
      start_period: 15s
    restart: unless-stopped

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-db-volume: